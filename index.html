<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f1">
  <meta name="description" content="A thoughtful workspace for every stage of editing and publishing. Keep projects, checklists, prompts, and notes together.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Publishing">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Publishing Checklist</title>
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css?v=4">
  <script type="module" src="./app.js?v=4"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <header class="site-header">
      <a class="brand" href="#projects" aria-label="Publishing Checklist home">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5.5C8.8 3.4 5.5 3.6 3 4.8v14c2.5-1.2 5.8-1.4 9 .7m0-14c3.2-2.1 6.5-1.9 9-.7v14c-2.5-1.2-5.8-1.4-9 .7m0-14v14"/></svg></span>
        <span>Publishing Checklist</span>
      </a>
      <div class="header-end">
        <span class="saved-indicator" id="saved-indicator"><i></i> Saved on this device</span>
        <div class="menu-wrap"><button class="icon-button" id="data-menu-button" aria-label="Backups and data" aria-expanded="false" aria-controls="data-menu"></button>
          <div class="dropdown data-menu" id="data-menu" hidden>
            <p class="menu-caption">YOUR WORKSPACE</p>
            <button data-action="export">Export backup <span>JSON</span></button>
            <button data-action="import">Restore from backup</button>
            <p class="menu-help">Saved in this browser. Export a backup to keep a copy or move devices.</p>
          </div>
        </div>
      </div>
    </header>
    <div id="storage-warning" class="storage-warning" role="alert" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <nav class="bottom-nav" aria-label="Workspace pages">
    <a href="#projects" id="nav-projects" aria-current="page"></a>
    <a href="#notes" id="nav-notes"></a>
  </nav>
  <dialog id="editor-dialog" class="dialog"><div id="editor-content"></div></dialog>
  <dialog id="confirm-dialog" class="dialog confirm-dialog"><form id="confirm-form"><div class="dialog-header"><div><p class="eyebrow">PLEASE CONFIRM</p><h2 id="confirm-title"></h2></div><button type="button" class="icon-button" data-close="confirm-dialog" aria-label="Close"></button></div><p id="confirm-description" class="confirm-description"></p><div class="dialog-actions"><button type="button" class="button secondary" data-close="confirm-dialog">Cancel</button><button class="button danger" id="confirm-submit" type="submit">Delete</button></div></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <noscript><div class="noscript">Please enable JavaScript to use your publishing workspace.</div></noscript>
</body>
</html>
